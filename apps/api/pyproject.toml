[project]
name = "primestone-api"
version = "0.1.0"
description = "API HTTP versionnée de PRIMESTONE EDITORIAL 2.0"
requires-python = ">=3.12"
dependencies = [
    "primestone",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.33",
]

[tool.uv.sources]
primestone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primestone_api"]
