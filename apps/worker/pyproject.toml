[project]
name = "primestone-worker"
version = "0.1.0"
description = "Worker de traitements asynchrones de PRIMESTONE EDITORIAL 2.0"
requires-python = ">=3.12"
dependencies = [
    "primestone",
]

[project.scripts]
primestone-worker = "primestone_worker.main:main"

[tool.uv.sources]
primestone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primestone_worker"]
