[project]
name = "primestone-worker"
version = "0.1.0"
description = "Worker de traitements asynchrones de PRIMESTONE EDITORIAL 2.0"
requires-python = ">=3.12"
dependencies = [
    "primestone",
]

[project.scripts]
primestone-worker = "primestone_worker.main:main"
primestone-library = "primestone_worker.cli:main"
primestone-vision = "primestone_worker.cli_vision:main"
primestone-forensic = "primestone_worker.cli_forensic:main"
primestone-knowledge = "primestone_worker.cli_knowledge:main"
primestone-editorial = "primestone_worker.cli_editorial:main"
primestone-lab = "primestone_worker.cli_lab:main"
primestone-market = "primestone_worker.cli_market:main"
primestone-script = "primestone_worker.cli_script:main"
primestone-performance = "primestone_worker.cli_performance:main"
primestone-audience = "primestone_worker.cli_audience:main"

[tool.uv.sources]
primestone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primestone_worker"]
