[project]
name = "primestone"
version = "0.1.0"
description = "Cœur métier de PRIMESTONE EDITORIAL 2.0 (modules d'intelligence, provenance, passerelle IA, tâches)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "anthropic>=2.8.0",
    "httpx>=0.28.1",
    "cryptography>=45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primestone"]
